# Switched On: check and deploy.
# Every push to main builds the site, runs the content checks on the source files and on the
# built pages, and publishes to GitHub Pages only if every check passes. A failed check stops
# the deploy, so the live site doesn't change. Pull requests run the same build and checks,
# but never publish.
name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:      # "Run workflow" button, e.g. after the custom domain is set

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - id: pages
        uses: actions/configure-pages@v6

      - name: Check the source files
        run: ruby _tools/check_content.rb

      - name: Build the site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Check the built pages
        run: ruby _tools/check_content.rb --site _site --baseurl "${{ steps.pages.outputs.base_path }}"

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
