# Switched On – site settings
# Private preview. Nothing here is live until John Paul says go.

title: "Switched On"
tagline: "Tech help for Irish homes, in plain English."
description: >-
  Independent, plain-English guides to phones, broadband, computers and apps
  in Ireland: what works here, what it costs here and where to buy it here.
url: "https://switchedon.ie"
baseurl: ""
lang: en-IE
locale: en_IE
timezone: Europe/Dublin

email: hello@switchedon.ie
editor:                   # checks and approves every guide (the byline: "Checked by")
  name: "John Paul Cunningham"
  url: "/about/john-paul-cunningham/"
sister_site:
  name: "On Air Ireland"
  url: "https://onairireland.ie/"
whatsapp_channel: "https://whatsapp.com/channel/0029Vb9YPSJAjPXOdYd02B2Q"  # the Switched On channel, linked in the footer
newsletter_form: "https://e92b58f7.sibforms.com/serve/MUIFAJR_xYRpk6EI-mMeLho4E9mTRm1Os6OPpKoNOeb0hHCZPnDVBYpsFD6D319QamXkf2y1UuBp_-YcI5mByqd_K79upKaaYZgq-40s8OGE6IYxwC9GnpwpMUmOofLXe4qNKi2GknD7APg4fSKGQx83KNoK0c8IiLIQoKwNtXzICH4sftKhdw_R7whm6Nma2tM454cR4r01nt6b2A=="  # Brevo form "Switched On newsletter sign-up (website)": double opt-in into the list "Switched On newsletter"

# Preview switches. preview_mode must be false before launch.
preview_mode: true          # shows the "private preview" bar and tells search engines not to index
preview_google_fonts: false # false = the fonts in assets/fonts/ are used (as at launch); true = load them from Google
goatcounter: "switchedon"      # GoatCounter site code (switchedon.goatcounter.com); the counter only loads when preview_mode is false

# Build
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
permalink: pretty
future: false

collections:
  guides:
    output: true
    permalink: /:path/   # _guides/buying/faulty-tech-rights.md -> /buying/faulty-tech-rights/

defaults:
  - scope:
      path: ""            # every page: the social card shown when a link is shared
    values:
      image: /assets/social/default.png
      author:             # what search engines see as the author: the site, as guides are drafted with AI help
        type: Organization
        name: "Switched On"
        url: "https://switchedon.ie/"
  - scope:
      path: ""
      type: guides
    values:
      layout: guide
      review_basis: research
      affiliate: false
  - scope:
      path: ""
      type: pages
    values:
      layout: page

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - scripts/
