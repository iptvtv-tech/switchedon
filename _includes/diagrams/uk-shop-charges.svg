<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 456" aria-hidden="true" focusable="false"><defs><marker id="dg-arrow-uk-shop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6470"/></marker></defs><rect x="1" y="1" width="358" height="50" rx="12" fill="#F3F5F4" stroke="#0A5C43" stroke-width="1.5"/>
<text x="180" y="31" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">Where are the goods when you order?</text>
<line x1="83.5" y1="51" x2="83.5" y2="79" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-uk-shop)"/>
<line x1="276.5" y1="51" x2="276.5" y2="79" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-uk-shop)"/>
<rect x="1" y="81" width="165" height="132" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="14" y="105" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#14181F">Great Britain</text>
<text x="14" y="127" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">You pay Irish VAT</text>
<text x="14" y="145" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">and customs duty.</text>
<text x="14" y="163" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">A €2 handling fee</text>
<text x="14" y="181" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">per item can be</text>
<text x="14" y="199" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">passed on to you.</text>
<rect x="194" y="81" width="165" height="132" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="207" y="105" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0A5C43">Northern Ireland,</text>
<text x="207" y="124" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0A5C43">Ireland or the EU</text>
<text x="207" y="148" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">No customs duty</text>
<text x="207" y="166" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">or handling fee</text>
<line x1="83.5" y1="213" x2="83.5" y2="241" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-uk-shop)"/>
<rect x="1" y="243" width="358" height="50" rx="12" fill="#F3F5F4" stroke="#0A5C43" stroke-width="1.5"/>
<text x="180" y="273" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">Did the checkout include VAT and duty?</text>
<line x1="83.5" y1="293" x2="83.5" y2="321" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-uk-shop)"/>
<text x="92.5" y="312" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43">No, or not clear</text>
<line x1="276.5" y1="293" x2="276.5" y2="321" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-uk-shop)"/>
<text x="285.5" y="312" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43">Yes</text>
<rect x="1" y="323" width="165" height="132" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="14" y="347" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">Pay on delivery</text>
<text x="14" y="369" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">The delivery company</text>
<text x="14" y="387" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">can ask for charges</text>
<text x="14" y="405" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">before it hands over</text>
<text x="14" y="423" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">your parcel. An Post</text>
<text x="14" y="441" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">may add a €6.95 fee.</text>
<rect x="194" y="323" width="165" height="132" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="207" y="347" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">Nothing more</text>
<text x="207" y="369" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">Nothing more should</text>
<text x="207" y="387" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">be due on delivery.</text></svg>
