<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 589" aria-hidden="true" focusable="false"><defs><marker id="dg-arrow-5g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6470"/></marker></defs><rect x="1" y="1" width="358" height="62" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="180.0" y="27" font-family="'Space Grotesk',system-ui,sans-serif" font-size="16" font-weight="700" fill="#14181F" text-anchor="middle">Check fibre first</text>
<text x="180.0" y="48" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#5B6470" text-anchor="middle">ComReg’s Broadband Checker, by Eircode</text>
<line x1="83.5" y1="63" x2="83.5" y2="92" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-5g)"/>
<rect x="1" y="94" width="165" height="110" rx="12" fill="#F3F5F4" stroke="#0A5C43" stroke-width="1.5"/>
<text x="83.5" y="129" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">Fixed broadband</text>
<text x="83.5" y="149" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">available at</text>
<text x="83.5" y="169" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">your home?</text>
<line x1="166" y1="149" x2="192" y2="149" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-5g)"/>
<text x="180.0" y="141" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43" text-anchor="middle">Yes</text>
<rect x="194" y="94" width="165" height="110" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="207" y="118" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">Compare first</text>
<text x="207" y="140" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">ComReg says mobile</text>
<text x="207" y="157" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">broadband won’t</text>
<text x="207" y="174" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">normally be as fast</text>
<text x="207" y="191" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">or as reliable.</text>
<line x1="83.5" y1="204" x2="83.5" y2="233" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-5g)"/>
<text x="92.5" y="223" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43">No</text>
<rect x="1" y="235" width="358" height="62" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="180.0" y="261" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#14181F" text-anchor="middle">Check the 5G signal at your address</text>
<text x="180.0" y="282" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#5B6470" text-anchor="middle">Vodafone by chat, Three’s checker, eir’s map</text>
<line x1="180.0" y1="297" x2="180.0" y2="325" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-5g)"/>
<rect x="1" y="327" width="358" height="44" rx="12" fill="#F3F5F4" stroke="#0A5C43" stroke-width="1.5"/>
<text x="180.0" y="354" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">Strong 5G signal indoors?</text>
<line x1="83.5" y1="371" x2="83.5" y2="401" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-5g)"/>
<text x="92.5" y="391" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43">Yes</text>
<line x1="276.5" y1="371" x2="276.5" y2="401" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-5g)"/>
<text x="285.5" y="391" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43">Weaker</text>
<rect x="1" y="403" width="165" height="114" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="14" y="427" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">Self-install</text>
<text x="14" y="449" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">Plug the router in</text>
<text x="14" y="466" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">near a window, or</text>
<text x="14" y="483" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">where the signal is</text>
<text x="14" y="500" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">strongest.</text>
<rect x="194" y="403" width="165" height="114" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="207" y="427" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0A5C43">Technician install</text>
<text x="207" y="449" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">Three can fit a modem</text>
<text x="207" y="466" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">on an outside wall</text>
<text x="207" y="483" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">and set up the router</text>
<text x="207" y="500" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">indoors.</text>
<rect x="1" y="531" width="358" height="56" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="180.0" y="555" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#14181F" text-anchor="middle">Doesn’t work well at home? Vodafone gives</text>
<text x="180.0" y="573" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#14181F" text-anchor="middle">you 14 days and Three 30 days to return it.</text></svg>
