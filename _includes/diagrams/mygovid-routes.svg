<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 535" aria-hidden="true" focusable="false" xmlns:c2pa="http://c2pa.org/manifest"><defs><marker id="dg-arrow-mygovid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6470"/></marker></defs><rect x="1" y="1" width="358" height="62" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="180.0" y="27" font-family="'Space Grotesk',system-ui,sans-serif" font-size="16" font-weight="700" fill="#14181F" text-anchor="middle">Create a basic MyGovID</text>
<text x="180.0" y="48" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#5B6470" text-anchor="middle">with your name, email and a password</text>
<line x1="83.5" y1="63" x2="83.5" y2="92" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-mygovid)"/>
<rect x="1" y="94" width="165" height="96" rx="12" fill="#F3F5F4" stroke="#0A5C43" stroke-width="1.5"/>
<text x="83.5" y="128" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">Already have a</text>
<text x="83.5" y="148" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">Public Services</text>
<text x="83.5" y="168" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">Card?</text>
<line x1="166" y1="142" x2="192" y2="142" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-mygovid)"/>
<text x="180.0" y="134" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43" text-anchor="middle">Yes</text>
<rect x="194" y="94" width="165" height="96" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="207" y="118" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">Verify online</text>
<text x="207" y="140" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">at MyGovID.ie with</text>
<text x="207" y="158" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">your card number</text>
<text x="207" y="176" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">and its expiry date</text>
<line x1="83.5" y1="190" x2="83.5" y2="220" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-mygovid)"/>
<text x="92.5" y="210" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43">No</text>
<rect x="1" y="222" width="358" height="145" rx="12" fill="#F3F5F4" stroke="#0A5C43" stroke-width="1.5"/>
<text x="180.0" y="248" font-family="'Inter',system-ui,sans-serif" font-size="15" font-weight="600" fill="#14181F" text-anchor="middle">Can you use the MyGovID app?</text>
<text x="16" y="274" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="600" fill="#5B6470">You’ll need:</text>
<text x="16" y="294" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#0A5C43">•</text>
<text x="28" y="294" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">a valid Irish passport book (not a card)</text>
<text x="16" y="313" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#0A5C43">•</text>
<text x="28" y="313" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">a phone with NFC and a front camera</text>
<text x="16" y="332" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#0A5C43">•</text>
<text x="28" y="332" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">to be 16 or over and live in Ireland</text>
<text x="16" y="351" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#0A5C43">•</text>
<text x="28" y="351" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">not to have been SAFE registered before</text>
<line x1="83.5" y1="367" x2="83.5" y2="397" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-mygovid)"/>
<text x="92.5" y="387" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43">No</text>
<line x1="276.5" y1="367" x2="276.5" y2="397" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-mygovid)"/>
<text x="285.5" y="387" font-family="'Inter',system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#0A5C43">Yes</text>
<rect x="1" y="399" width="165" height="134" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="14" y="423" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">Get a card first</text>
<text x="14" y="445" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">at a Public Services</text>
<text x="14" y="463" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">Card centre, then</text>
<text x="14" y="481" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">verify online at</text>
<text x="14" y="499" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">MyGovID.ie</text>
<rect x="194" y="399" width="165" height="134" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="207" y="423" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">Use the app</text>
<text x="207" y="445" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">Scan your passport</text>
<text x="207" y="463" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">and take a selfie.</text>
<text x="207" y="481" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">If you’re approved,</text>
<text x="207" y="499" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">your card comes</text>
<text x="207" y="517" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="400" fill="#14181F">by post.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
