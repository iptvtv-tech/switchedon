<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 624" aria-hidden="true" focusable="false"><defs><marker id="dg-arrow-recycle" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6470"/></marker></defs><rect x="1" y="1" width="358" height="78" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="180.0" y="27" font-family="'Space Grotesk',system-ui,sans-serif" font-size="16" font-weight="700" fill="#14181F" text-anchor="middle">Erase it first</text>
<text x="180.0" y="49" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#5B6470" text-anchor="middle">Phone or laptop? Back it up and erase it,</text>
<text x="180.0" y="66" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#5B6470" text-anchor="middle">using the maker’s own steps.</text>
<line x1="180.0" y1="79" x2="180.0" y2="106" stroke="#5B6470" stroke-width="1.5" marker-end="url(#dg-arrow-recycle)"/>
<text x="180.0" y="124" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15" font-weight="700" fill="#14181F" text-anchor="middle">Then recycle it free:</text>
<rect x="1" y="138" width="358" height="96" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<rect x="15" y="151" width="169" height="20" rx="10" fill="#0E7C5A" stroke="#0E7C5A" stroke-width="1"/>
<text x="99.5" y="165" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.06em">NO PURCHASE NEEDED</text>
<text x="15" y="192" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">A recycling centre</text>
<text x="15" y="212" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">Any local authority recycling centre takes</text>
<text x="15" y="229" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">anything with a plug, battery or cable.</text>
<rect x="1" y="244" width="358" height="96" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<rect x="15" y="257" width="219" height="20" rx="10" fill="#0E7C5A" stroke="#0E7C5A" stroke-width="1"/>
<text x="124.5" y="271" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.06em">NO PURCHASE, SMALL ITEMS</text>
<text x="15" y="298" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">A large electrical shop</text>
<text x="15" y="318" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">More than 400 square metres for selling</text>
<text x="15" y="335" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">electrical goods: items under 25cm.</text>
<rect x="1" y="350" width="358" height="96" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<rect x="15" y="363" width="153" height="20" rx="10" fill="#0E7C5A" stroke="#0E7C5A" stroke-width="1"/>
<text x="91.5" y="377" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.06em">WHEN YOU BUY NEW</text>
<text x="15" y="404" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">The shop you buy from</text>
<text x="15" y="424" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">It takes your old one free, one for one,</text>
<text x="15" y="441" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">if it’s a similar type.</text>
<rect x="1" y="456" width="358" height="96" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<rect x="15" y="469" width="144" height="20" rx="10" fill="#0E7C5A" stroke="#0E7C5A" stroke-width="1"/>
<text x="87.0" y="483" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.06em">WITH A DELIVERY</text>
<text x="15" y="510" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">Collected with the new one</text>
<text x="15" y="530" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">At no extra cost, if it’s a similar type.</text>
<text x="15" y="547" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">Have it clean, empty and disconnected.</text>
<rect x="1" y="566" width="358" height="56" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="180.0" y="590" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#14181F" text-anchor="middle">Never in your household bin: batteries</text>
<text x="180.0" y="608" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="600" fill="#14181F" text-anchor="middle">in old devices can cause fires.</text></svg>
