<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 538" aria-hidden="true" focusable="false"><defs><marker id="dg-arrow-scamcalls" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5B6470"/></marker></defs><text x="1" y="18" font-family="'Space Grotesk',system-ui,sans-serif" font-size="16" font-weight="700" fill="#14181F">ComReg’s Stay Scam Safe</text>
<line x1="17" y1="60" x2="17" y2="348" stroke="#7C8682" stroke-width="2"/>
<circle cx="17" cy="60" r="14" fill="#0E7C5A"/>
<text x="17" y="65" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="42" y="32" width="317" height="84" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="56" y="61" font-family="'Space Grotesk',system-ui,sans-serif" font-size="16" font-weight="700" fill="#14181F">Stop</text>
<text x="56" y="83" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">Don’t rush. Hang up if a caller pressures</text>
<text x="56" y="100" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">you, says it’s urgent or threatens you.</text>
<circle cx="17" cy="156" r="14" fill="#0E7C5A"/>
<text x="17" y="161" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="42" y="128" width="317" height="84" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="56" y="157" font-family="'Space Grotesk',system-ui,sans-serif" font-size="16" font-weight="700" fill="#14181F">Check</text>
<text x="56" y="179" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">Do you recognise the number? A number</text>
<text x="56" y="196" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">on your screen proves nothing.</text>
<circle cx="17" cy="252" r="14" fill="#0E7C5A"/>
<text x="17" y="257" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="42" y="224" width="317" height="84" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="56" y="253" font-family="'Space Grotesk',system-ui,sans-serif" font-size="16" font-weight="700" fill="#14181F">Avoid</text>
<text x="56" y="275" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">Don’t use a number or link from the caller.</text>
<text x="56" y="292" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">Use the organisation’s official details.</text>
<circle cx="17" cy="348" r="14" fill="#0E7C5A"/>
<text x="17" y="353" font-family="'Space Grotesk',system-ui,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="42" y="320" width="317" height="84" rx="12" fill="#FFFFFF" stroke="#7C8682" stroke-width="1.5"/>
<text x="56" y="349" font-family="'Space Grotesk',system-ui,sans-serif" font-size="16" font-weight="700" fill="#14181F">Mark it</text>
<text x="56" y="371" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">Mark it as spam, and block it if it keeps</text>
<text x="56" y="388" font-family="'Inter',system-ui,sans-serif" font-size="13" font-weight="400" fill="#14181F">calling. Or ask your network to block it.</text>
<rect x="1" y="424" width="358" height="112" rx="12" fill="#E7F2EF" stroke="#0E7C5A" stroke-width="1.5"/>
<text x="15" y="451" font-family="'Space Grotesk',system-ui,sans-serif" font-size="15.5" font-weight="700" fill="#0A5C43">Caught out? Act quickly</text>
<text x="15" y="475" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="500" fill="#14181F">1. Change your passwords and PINs.</text>
<text x="15" y="495" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="500" fill="#14181F">2. Ask your bank to recall any payment.</text>
<text x="15" y="515" font-family="'Inter',system-ui,sans-serif" font-size="13.5" font-weight="500" fill="#14181F">3. Report it to your local Garda station.</text></svg>
